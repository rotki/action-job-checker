name: Job Checker
description: Detect changes per configurable group and decide which CI jobs should run
author: Rotki Solutions GmbH
inputs:
  token:
    description: Github token
    required: true
  config:
    description: Inline YAML/JSON config describing job groups. Ignored when `config_path` is set.
    required: false
  config_path:
    description: Path to a YAML/JSON config file describing job groups. Takes precedence over `config`.
    required: false
  skip_label:
    description: PR label that will cause all tasks to be skipped
    required: false
    default: skip ci

outputs: {}

runs:
  using: node24
  main: dist/index.js
